<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-5">

  <h2 class="text-2xl font-bold">My Watchlist</h2>

  <!-- Genre filter -->
  <div class="mt-5">
    <label for="genreFilter" class="mb-2 block text-sm font-medium">
      Filter by genre
    </label>

    <select id="genreFilter"
      class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
      <option value="all">All Genres</option>
      <option value="Action">Action</option>
      <option value="Comedy">Comedy</option>
      <option value="Drama">Drama</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Animation">Animation</option>
      <option value="Documentary">Documentary</option>
      <option value="Horror">Horror</option>
    </select>
  </div>

  <!-- Watched status filter -->
  <div class="mt-4">
    <label for="statusFilter" class="mb-2 block text-sm font-medium">
      Filter by status
    </label>

    <select id="statusFilter"
      class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
      <option value="all">All Titles</option>
      <option value="watched">Watched</option>
      <option value="unwatched">Unwatched</option>
    </select>
  </div>

  <!-- Number of results -->
  <p id="resultCount" class="mt-4 text-sm text-slate-400"></p>

  <!-- JavaScript will place the cards here -->
  <div id="movieGrid" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
  </div>

</section>
<script src="./movie.js"></script>
</body>
</html>
